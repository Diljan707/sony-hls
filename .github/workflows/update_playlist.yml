name: Update Sony Playlist

on:
  schedule:
    - cron: '0 */4 * * *' # ਹਰ 4 ਘੰਟੇ ਬਾਅਦ ਆਟੋਮੈਟਿਕ ਅੱਪਡੇਟ
  workflow_dispatch: # ਮੈਨੂਅਲ ਰਨ ਕਰਨ ਲਈ

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        run: python update_sony_playlist.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add all_sony_live_tokens.m3u
          git commit -m "Auto-refresh Sony live stream tokens" || exit 0
          git push
